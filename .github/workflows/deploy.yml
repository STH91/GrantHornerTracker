name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Deployment-specific values are repository secrets rather than
      # committed, so the config wrangler deploys from is generated here.
      - name: Write the wrangler config
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          APP_HOSTNAME: ${{ secrets.APP_HOSTNAME }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: npm run config
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Pinned deliberately. The action otherwise installs its own default,
          # which was wrangler 3.90.0 — a version that ignores the `assets`
          # config silently, with no warning, deploying a Worker with no static
          # files behind it. Bump this only alongside a dry run that still
          # reports the ASSETS binding.
          wranglerVersion: '4.128.0'
          command: deploy -c wrangler.generated.jsonc
